<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceding Ground: Boston's waterfront negotiation</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="stage">
  <div class="mapwrap" id="wrap-planner"><div id="map-planner" class="map"></div></div>
  <div class="mapwrap" id="wrap-atlas">
    <div id="map-atlas" class="map"></div>
    <div class="grain"></div>
  </div>
  <div class="mapwrap" id="wrap-ink">
    <div id="map-ink" class="map"></div>
    <canvas id="ink-canvas"></canvas>
    <div class="grain"></div>
  </div>
  <div class="mapwrap" id="wrap-sat"><div id="map-sat" class="map"></div></div>
  <div id="lens-ring"></div>
</div>

<aside id="panel" class="card" aria-label="Map controls">
  <button type="button" class="card-head" aria-expanded="true" aria-controls="panel-body"><span class="card-title">Map controls</span><svg class="tog" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/><path class="chev" d="m8 9 3 3-3 3"/></svg></button>
  <div class="card-body" id="panel-body"><div>
  <details class="acc" open>
    <summary>Map view</summary>
    <div class="acc-body">
      <div class="field"><span class="ctl-label">View mode</span>
        <div class="seg" id="seg-view" role="group" aria-label="View mode">
          <button data-v="planner">Basemap</button><button data-v="atlas">Etching</button><button data-v="ink">Overprint</button>
        </div></div>
    </div>
  </details>
  <details class="acc" open>
    <summary>Map X-Ray</summary>
    <div class="acc-body">
      <div id="seg-lens">
        <label class="chk"><input type="checkbox" data-lens="other"> <span id="lens-other">Etching</span></label>
        <label class="chk"><input type="checkbox" data-lens="sat"> Satellite</label>
      </div>
    </div>
  </details>
  <details class="acc" open>
    <summary>Layers</summary>
    <div class="acc-body" id="controls"></div>
  </details>
  </div></div>
</aside>
<aside id="legend-panel" class="card" aria-label="Legend">
  <div class="card-head static"><span class="card-title">Legend</span></div>
  <div class="card-body"><div><section id="legend"></section></div></div>
</aside>

<script src="data/stats.js"></script>
<script src="data/parcels.js"></script>
<script src="data/flood21.js"></script>
<script src="data/flood36.js"></script>
<script src="data/water.js"></script>
<script src="data/aoi.js"></script>
<script src="data/stores.js"></script>
<script src="data/streets.js"></script>
<script src="data/tracts.js"></script>
<script src="data/svi.js"></script>
<script src="data/blueline.js"></script>
<script src="data/stations.js"></script>
<script src="data/assets.js"></script>
<script src="data/power_subs.js"></script>
<script src="data/land.js"></script>
<script src="data/shore.js"></script>
<script src="data/ink.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="overprint.js"></script>
<script src="app.js"></script>
</body>
</html>
